<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal AI Assistant — Settings</title><link rel="stylesheet" href="options.css"></head><body><main class="page"><header><div class="logo">✦</div><div><h1>Universal AI Assistant</h1><p>Configure the model used by the browser assistant.</p></div></header><section class="card"><h2>Connection</h2><label>API endpoint<span>OpenAI-compatible chat completions endpoint</span><input id="endpoint" placeholder="https://…/v1/chat/completions"></label><label>API key<span>Stored locally in this browser</span><input id="apiKey" type="password" autocomplete="off" placeholder="Enter API key"></label></section><section class="card"><h2>Models</h2><label>Primary model<input id="model"></label><label>Fallback models<span>Comma- or newline-separated</span><input id="fallbackModels"></label></section><section class="card"><h2>Generation</h2><div class="grid"><label>Max output tokens<input id="maxTokens" type="number" min="128" max="8192"></label><label>Temperature<input id="temperature" type="number" min="0" max="2" step=".05"></label></div></section><footer><span id="message"></span><button id="save">Save settings</button></footer></main><script src="options.js"></script></body></html>
